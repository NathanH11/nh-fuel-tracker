name: Refresh fuel prices
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices from Fuel Finder
        env:
          FF_CLIENT_ID: ${{ secrets.FF_CLIENT_ID }}
          FF_CLIENT_SECRET: ${{ secrets.FF_CLIENT_SECRET }}
          FF_BASE_URL: ${{ secrets.FF_BASE_URL }}
        run: python scripts/refresh.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
