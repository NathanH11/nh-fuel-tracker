name: Refresh fuel prices
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore last good data
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: docs/data/stations.json
          key: stations-${{ github.run_id }}
          restore-keys: stations-
      - name: Fetch prices from Fuel Finder
        if: github.event_name != 'push' || steps.cache.outputs.cache-matched-key == ''
        env:
          FF_CLIENT_ID: ${{ secrets.FF_CLIENT_ID }}
          FF_CLIENT_SECRET: ${{ secrets.FF_CLIENT_SECRET }}
          FF_BASE_URL: ${{ secrets.FF_BASE_URL }}
          FF_PROXY_SECRET: ${{ secrets.FF_PROXY_SECRET }}
        run: |
          for attempt in 1 2 3; do
            python scripts/refresh.py && exit 0
            echo "Attempt $attempt failed. Waiting 6 minutes before trying again..."
            sleep 360
          done
          exit 1
      - name: Save data for next time
        if: success() && (github.event_name != 'push' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v6
        with:
          path: docs/data/stations.json
          key: stations-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
