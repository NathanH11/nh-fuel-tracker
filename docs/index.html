<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Local Fuel Prices</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{
 --bg:#0b0d12;--bg2:#11141b;--card:#151923;--card2:#1b2030;--text:#f3f5f9;--mute:#8d95a8;--line:#262c3a;
 --accent:#e8207f;--accent2:#8b5cf6;--grad:linear-gradient(135deg,#ff2d87 0%,#c026d3 50%,#7c3aed 100%);
 --good:#22c55e;--goodbg:rgba(34,197,94,.14);--mid:#f59e0b;--bad:#ef4444;
 --r:18px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);
 --navh:0px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
 font:15.5px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 -webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select{font:inherit}
/* the soft glow sits on its own fixed layer, so scrolling never repaints it */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(900px 420px at 85% -120px,rgba(192,38,211,.18),transparent 70%),
 radial-gradient(700px 380px at -10% -60px,rgba(232,32,127,.14),transparent 70%)}
::selection{background:rgba(232,32,127,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:1100;padding-top:env(safe-area-inset-top,0);
 background:var(--bg);
 border-bottom:1px solid rgba(255,255,255,.05)}
.top-in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.mark{flex:none;width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px -6px rgba(232,32,127,.7)}
.mark svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
h1{font-size:1.08rem;font-weight:720;letter-spacing:-.015em;margin:0;line-height:1.2}
.sub{color:var(--mute);font-size:.78rem;margin:2px 0 0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 6px rgba(34,197,94,.7)}
#gear{flex:none;width:40px;height:40px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;cursor:pointer;color:var(--text);transition:background .2s,transform .2s}
#gear:hover{background:rgba(255,255,255,.1)}#gear:active{transform:scale(.94)}
#gear svg{width:20px;height:20px}

main{max-width:900px;margin:0 auto;padding:16px 16px calc(24px + var(--navh))}

/* ---------- tabs: segmented on desktop, bottom bar on phones ---------- */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);padding:4px;border-radius:16px;margin-bottom:18px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;color:var(--mute);font-weight:620;font-size:.86rem;padding:10px 4px;border-radius:12px;cursor:pointer;transition:color .2s,background .2s}
.tabs button svg{width:18px;height:18px;flex:none}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 14px -4px rgba(0,0,0,.6)}
.tabs button[aria-selected=true] svg{color:var(--accent)}
@media (max-width:699px){
 :root{--navh:calc(68px + env(safe-area-inset-bottom,0px))}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:1200;margin:0;border-radius:0;border:0;border-top:1px solid rgba(255,255,255,.07);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg)}
 .tabs button{flex-direction:column;gap:3px;font-size:.68rem;padding:7px 2px;border-radius:12px}
 .tabs button svg{width:22px;height:22px}
 .tabs button[aria-selected=true]{background:none;box-shadow:none;color:var(--text)}
 .tabs button[aria-selected=true] svg{filter:drop-shadow(0 0 8px rgba(232,32,127,.55))}
}

section:not([hidden]){animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- station rows ---------- */
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:12px 14px 12px 12px;margin-bottom:10px;color:inherit;text-align:left;cursor:pointer;transition:transform .18s,border-color .18s,background .18s}
.row:hover{border-color:rgba(232,32,127,.45);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02))}
.row:active{transform:scale(.985)}
.row .info{flex:1;min-width:0}
.name{font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{color:var(--mute);font-size:.8rem;margin-top:1px}
.l3{color:#c9cfdc;font-size:.8rem;margin-top:3px}
.price{text-align:right;white-space:nowrap}
.big{font-size:1.55rem;font-weight:760;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:.55em;font-weight:650;color:var(--mute);margin-left:1px;letter-spacing:0}
.lab{font-size:.68rem;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;font-weight:600;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.tier{width:7px;height:7px;border-radius:50%;background:var(--tier,#94a3b8);box-shadow:0 0 8px var(--tier,#94a3b8)}
.tank{font-size:.74rem;color:var(--mute)}
.badge{display:inline-block;vertical-align:2px;background:var(--goodbg);color:#4ade80;font-size:.64rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-left:8px;border:1px solid rgba(74,222,128,.25)}
.fav{color:#fbbf24;margin-right:4px}

.logo{position:relative;flex:none;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-align:center;line-height:1.05;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 4px 12px -4px rgba(0,0,0,.6)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
.logo.mk{background:#fff}.logo svg{width:100%;height:100%;display:block}

/* fuel card toggle */
.fct{margin:14px 0 0!important;padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);transition:border-color .2s,background .2s}
.fct:has(input:checked){border-color:rgba(59,130,246,.45);background:linear-gradient(90deg,rgba(30,91,216,.16),rgba(225,37,27,.06))}
.fct .ct{flex:1;min-width:0;line-height:1.3}.fct .ct b{display:block;font-weight:650}.fct .ct span{font-size:.78rem;color:var(--mute)}
.ccard{flex:none;width:46px;height:31px;border-radius:6px;box-shadow:0 4px 12px -4px rgba(0,0,0,.7);transform:rotate(-6deg);transition:transform .3s}
.fct:hover .ccard{transform:rotate(0)}
.ccard svg,.ci svg{display:block;width:100%;height:100%}
.ci{display:inline-block;width:17px;height:12px;vertical-align:-1px;margin-left:4px}
.h2{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 2px 10px;display:flex;justify-content:space-between}

/* ---------- cards, empties, buttons ---------- */
.fcard{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:14px 16px;margin-bottom:4px}
.empty{background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.12);border-radius:var(--r);padding:28px 20px;color:var(--mute);text-align:center;line-height:1.55}
.empty b{color:var(--text)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--grad);color:#fff;border:0;border-radius:99px;padding:10px 16px;font-weight:650;font-size:.88rem;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px -8px rgba(232,32,127,.8);transition:transform .15s,filter .15s}
.act:hover{filter:brightness(1.1)}.act:active{transform:scale(.96)}
.act.mute,.act.star,.act.cardb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);box-shadow:none;color:var(--text)}
.act.mute:hover,.act.star:hover,.act.cardb:hover{background:rgba(255,255,255,.12)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#more,#bMore{display:flex;margin:6px auto 0}

/* ---------- bottom sheet ---------- */
#sheet{position:fixed;inset:0;z-index:2000;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,10,.72);animation:fade .2s}
#sheet[hidden]{display:none}
#sheet .card{position:relative;background:linear-gradient(180deg,#1a1e2b,#141822);border:1px solid rgba(255,255,255,.08);border-bottom:0;width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:26px 18px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;box-shadow:0 -20px 60px -10px rgba(0,0,0,.7);animation:up .32s cubic-bezier(.2,.9,.25,1)}
#sheet .card::before{content:"";position:absolute;top:9px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.18)}
@media (min-width:700px){#sheet{align-items:center}#sheet .card{border-radius:24px;border-bottom:1px solid rgba(255,255,255,.08);padding-top:22px}#sheet .card::before{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.card h2{margin:0 0 4px;font-size:1.2rem;letter-spacing:-.015em}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:8px}.dh h2{margin:0}
.fuels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.fuel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}
.fuel .lab{justify-content:flex-start}
.fuel.d{border-color:transparent;background:linear-gradient(var(--card2),var(--card2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.fuel .big{font-size:1.7rem;margin:2px 0}

/* ---------- form controls ---------- */
.fld{display:block;margin:14px 0;font-size:.84rem;color:var(--mute)}
.fld select,.fld input,.brow input[type=number]{display:block;width:100%;margin-top:6px;font-size:1rem;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld select:focus,.fld input:focus,.tfield input:focus,#sheet input[type=number]:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,32,127,.2)}
.fld input[type=range]{padding:0;border:0;background:none;margin-top:0}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:.9rem;cursor:pointer;color:var(--text)}
.chk input{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:40px;height:24px;margin:0;border-radius:99px;background:var(--line);cursor:pointer;transition:background .2s}
.chk input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.chk input:checked{background:var(--grad)}
.chk input:checked::after{transform:translateX(16px)}
.seg{display:flex;gap:4px;margin-bottom:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-weight:640;padding:9px;border-radius:10px;cursor:pointer;transition:all .2s}
.seg button[aria-pressed=true]{background:var(--grad);color:#fff;box-shadow:0 4px 14px -6px rgba(232,32,127,.8)}
#best-ctl .act{margin-bottom:12px}
.small{color:var(--mute);font-size:.78rem;margin:10px 0 0;line-height:1.5}
footer.small{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.05);opacity:.8}

/* slider: filled with the gradient up to the thumb (--p set from JS) */
.tankwrap{margin-top:10px}
.tankwrap input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:0;background:transparent;touch-action:pan-y;cursor:pointer}
.tankwrap input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#ff2d87,#c026d3 var(--p,50%),var(--line) var(--p,50%))}
.tankwrap input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
.tankwrap input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:linear-gradient(90deg,#ff2d87,#c026d3)}
.tankwrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(232,32,127,.25),0 2px 6px rgba(0,0,0,.5);transition:box-shadow .2s}
.tankwrap input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 9px rgba(232,32,127,.25),0 2px 6px rgba(0,0,0,.5)}
.tankwrap input[type=range]::-moz-range-thumb{box-sizing:border-box;width:24px;height:24px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(232,32,127,.25),0 2px 6px rgba(0,0,0,.5)}
.ticks{position:relative;height:30px;margin:0 12px}
.ticks i{position:absolute;top:0;width:2px;height:6px;margin-left:-1px;border-radius:1px;background:var(--mute);opacity:.4}.ticks i.mj{height:10px;opacity:.8}
.ticks b{position:absolute;top:13px;transform:translateX(-50%);font-size:.7rem;font-weight:650;color:var(--mute)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}.brow input[type=number]{width:72px}
details summary{cursor:pointer;padding:6px 0}

/* ---------- journey search ---------- */
.trip{position:relative}.tfield{position:relative;margin-bottom:8px}
.tfield input{width:100%;font-size:1rem;padding:13px 50px 13px 40px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.dt{position:absolute;left:14px;top:16px;width:14px;height:14px;border-radius:50%;border:3px solid}.dt.a{border-color:#22c55e}.dt.b{border-color:#ef4444}
.swap{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:1.1rem;cursor:pointer;transition:transform .25s}
.swap:hover{transform:translateY(-50%) rotate(180deg)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:1500;background:#1a1e2b;border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);overflow:hidden;margin-top:4px}
.sg{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);padding:11px 14px;color:var(--text);cursor:pointer}.sg:hover{background:rgba(255,255,255,.05)}.sg span{display:block;font-size:.78rem;color:var(--mute)}
.sgn{padding:11px 14px;color:var(--mute);font-size:.85rem}
#tInfo{font-size:.9rem;margin:4px 0 6px;min-height:1.3em}

/* ---------- maps ---------- */
#map{height:calc(100dvh - 230px - var(--navh));min-height:380px;border-radius:var(--r);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow)}
#map2{height:300px;border-radius:var(--r);border:1px solid rgba(255,255,255,.08);margin:10px 0}
.leaflet-container{background:#0e1117;font:inherit}
#map .leaflet-tile-pane,#map2 .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1a1e2b;color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.leaflet-popup-content-wrapper{border-radius:16px;border:1px solid rgba(255,255,255,.08)}
.leaflet-popup-content{margin:14px 16px;line-height:1.5}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.leaflet-bar,.leaflet-bar a{background:#1a1e2b!important;color:var(--text)!important;border-color:rgba(255,255,255,.08)!important}
.leaflet-bar{border:1px solid rgba(255,255,255,.1)!important;border-radius:12px!important;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4)!important}
.leaflet-control-attribution{background:rgba(11,13,18,.7)!important;color:var(--mute)!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:#c4b5fd!important}
.leaflet-tooltip{background:#1a1e2b;color:var(--text);border:1px solid rgba(255,255,255,.1);font-weight:700;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-tooltip-top:before{border-top-color:#1a1e2b}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(232,32,127,.22)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:linear-gradient(135deg,#ff2d87,#7c3aed)!important;color:#fff;font-weight:750}
.fp{border:2px solid #fff;border-radius:9px;font-weight:800;font-size:13px;padding:2px 7px;white-space:nowrap;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.fp.gold{border:3px solid #ffd400;box-shadow:0 0 0 2px #111,0 0 14px 4px rgba(255,212,0,.8)}
.ab{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}.ab.a{background:#16a34a}.ab.b{background:#dc2626}
.ab.w{background:#f59e0b;font-size:12px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.76rem;color:var(--mute);margin:12px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.pop b{font-size:1.1rem}.pop .act{margin-top:10px;padding:8px 13px;font-size:.82rem}

/* ---------- loading skeleton ---------- */
.skel{height:76px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite}
.skel.tall{height:190px}
@keyframes shim{to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top-in">
<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"/><path d="M3 21h13"/><path d="M7 8h5"/><path d="M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg></div>
<div class="ttl"><h1>My Local Fuel Prices</h1><p class="sub" id="stamp">Loading…</p></div>
<button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
</div></header>
<main>
<nav class="tabs" role="tablist">
<button id="t-list" data-v="list" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg><span>My stations</span></button>

<button id="t-map" data-v="map" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="m9 4-6 2.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>UK map</span></button>
<button id="t-best" data-v="best" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Best value</span></button>

<section id="v-list"><div id="fillcard" class="fcard"></div><div id="favrows"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section>
<section id="v-near" hidden></section>
<section id="v-best" hidden><div class="seg" id="best-seg"></div><div id="best-ctl"></div><div id="best-out"></div></section>

<div id="map"></div>
<div class="legend"><span><i style="background:#16a34a"></i>Cheap</span><span><i style="background:#f59e0b"></i>Average</span><span><i style="background:#dc2626"></i>Expensive</span><span>★ box = my stations</span><span>Gold outline = cheapest of mine</span></div>
</section>
<footer class="small">Prices from the UK Government Fuel Finder scheme. Contains public sector information licensed under the Open Government Licence v3.0. Always check the pump price before filling up.</footer>
</main>
<div id="sheet" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
// New visitors start with the stations in config.json. Set to false to start everyone with an empty list.
const START_WITH_OWNER_LIST=true;
const FUELS=[["d","Diesel"],["p","Petrol (E10)"],["sp","Super unleaded"],["sd","Super diesel"]];
const FN=Object.fromEntries(FUELS);
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let cardDirty=false,curPop=null;
let D=null,byId={},map=null,cl=null,favLayer=null,me=null,meDot=null,meAcc=null,loc=null,thr={},view="list",nShow=40;
let S=Object.assign({fuel:"d",radius:15,car:"",tank:null,mpg:null,fillPct:100,useLevel:false,level:25},store.get("fuel-settings-v1",{}));
S.card=Object.assign({on:false,brands:{},ov:{}},S.card||{});
S.card.r=Object.assign({d:4,p:3,sp:5,sd:6},S.card.r||{}); // pence off per litre by fuel
S.card.brands={esso:true}; // WEX card: Esso stations only (single stations can be overridden)
let FAV=store.get("fuel-favs-v1",null);

const fp=v=>v==null?"—":v.toFixed(1)+"p";
const fpH=v=>v==null?"—":v.toFixed(1)+"<small>p</small>";
const gbp=v=>"£"+v.toFixed(2);
function ago(t){if(!t)return"";const m=Math.round((Date.now()-new Date(t))/60000);if(isNaN(m))return"";return m<60?m+" min ago":m<2880?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago"}
const subline=(s,...p)=>[...p,s.pc,s.u?"updated "+ago(s.u):""].filter(Boolean).join(" · ");
function km(a,b,c,d){const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(x))}

const BR=[["esso","ESSO","#0a3d91","#fff"],["shell","SHELL","#fbce07","#dd1d21"],["bp","BP","#009a44","#ffe600"],["tesco","TESCO","#00539f","#fff"],["sainsbury","Sainsbury’s","#f06c00","#fff"],["asda","ASDA","#78be20","#fff"],["costco","COSTCO","#e31837","#fff"],["eg","EG","#003a70","#fff"],["texaco","TEXACO","#e31837","#fff"],["jet","JET","#ffd800","#111"],["morrisons","MORRISONS","#00704a","#ffd100"],["gulf","GULF","#f58220","#00529b"],["murco","MURCO","#d71920","#fff"],["applegreen","APPLEGREEN","#6cb33f","#fff"],["total","TOTAL","#475467","#fff"],["maxol","MAXOL","#475467","#fff"],["harvest","HARVEST","#475467","#fff"],["circlek","CIRCLE K","#475467","#fff"],["welcome","WELCOME BREAK","#475467","#fff"]];
// Simple drawn marks in each brand's colours (my own approximations, not the official artwork).
const MARKS={
esso:`<svg viewBox="0 0 64 64"><ellipse cx="32" cy="32" rx="29" ry="19" fill="#fff" stroke="#0b3f93" stroke-width="4"/><text x="32" y="39" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-style="italic" font-size="22" fill="#e1251b" textLength="40" lengthAdjust="spacingAndGlyphs">Esso</text></svg>`,
shell:`<svg viewBox="0 0 64 64"><path d="M9.8 27.1A4.9 4.9 0 0 1 13.5 19.3A4.9 4.9 0 0 1 19.8 13.5A4.9 4.9 0 0 1 27.7 10.4A4.9 4.9 0 0 1 36.3 10.4A4.9 4.9 0 0 1 44.2 13.5A4.9 4.9 0 0 1 50.5 19.3A4.9 4.9 0 0 1 54.2 27.1Q53.4 39.5 42.5 45.6V53H21.5V45.6Q10.6 39.5 9.8 27.1Z" fill="#fbce07" stroke="#dd1d21" stroke-width="3" stroke-linejoin="round"/><path d="M26.4 45.6L13.5 19.3M28.6 45.6L19.8 13.5M30.9 45.6L27.7 10.4M33.1 45.6L36.3 10.4M35.4 45.6L44.2 13.5M37.6 45.6L50.5 19.3M21.5 46.5H42.5" stroke="#dd1d21" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>`,
bp:(()=>{ // a sunflower of petal rings in BP-style greens and yellow
 const ring=(n,R,r,rot,c)=>{let p="";for(let i=0;i<n*2;i++){const a=(i*180/n+rot)*Math.PI/180,d=i%2?r:R;p+=`${(32+d*Math.sin(a)).toFixed(2)},${(32-d*Math.cos(a)).toFixed(2)} `}return `<polygon points="${p}" fill="${c}" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>`};
 return `<svg viewBox="0 0 64 64">${ring(18,29,21,0,"#009a44")}${ring(18,24,16.5,10,"#4fb848")}${ring(18,18.5,12.5,0,"#a6d036")}${ring(18,14.5,11,10,"#ffe600")}<circle cx="32" cy="32" r="10.5" fill="#fff"/><text x="32" y="36.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="13" letter-spacing="-.6" fill="#009a44">bp</text></svg>`})(),
sainsbury:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#f06c00"/><text x="32" y="36" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="12" fill="#fff" textLength="54" lengthAdjust="spacingAndGlyphs">Sainsbury’s</text></svg>`,
asda:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#78be20"/><text x="32" y="41" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="21" fill="#fff" textLength="52" lengthAdjust="spacingAndGlyphs">ASDA</text></svg>`,
costco:`<svg viewBox="0 0 64 64"><text x="32" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="15" fill="#e31837" textLength="56" lengthAdjust="spacingAndGlyphs">COSTCO</text><text x="32" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="9" fill="#005daa" textLength="52" lengthAdjust="spacingAndGlyphs">WHOLESALE</text></svg>`,
eg:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#003a70"/><text x="32" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="30" fill="#fff" textLength="40" lengthAdjust="spacingAndGlyphs">eg</text></svg>`
};
const RX={eg:/\beg\b|euro ?garages?/,bp:/\bbp\b/,jet:/\bjet\b/,total:/\btotal/,circlek:/circle ?k/,welcome:/welcome ?break/};
function brandHit(k,t){return RX[k]?RX[k].test(t):t.includes(k)}
function brand(s){const tests=[(s.b||"").toLowerCase(),(s.n||"").toLowerCase()];
 for(const t of tests)for(const b of BR)if(brandHit(b[0],t))return b;
 return["pump","⛽","#667085","#fff"]}
// To use the real logos, drop logos/<name>.svg (or .png) into the docs folder, e.g. logos/esso.svg,
// then list it here so the page knows to load it, e.g. {esso:"svg",shell:"png"}.
// Brands not listed use the built-in drawn logo, and no file is requested for them.
const LOGO_FILES={};
function logo(s){const b=brand(s),mk=MARKS[b[0]],ext=LOGO_FILES[b[0]];
 const img=ext?`<img src="logos/${b[0]}.${ext}" alt="" onerror="this.remove()">`:"";
 if(mk)return `<span class="logo mk">${mk}${img}</span>`;
 const fs=b[1].length>8?8:b[1].length>6?10:b[1].length>3?12:16;
 return `<span class="logo" style="background:${b[2]};color:${b[3]};font-size:${fs}px">${esc(b[1])}${img}</span>`}

// favourites (per device) and settings
const favIds=()=>FAV||(START_WITH_OWNER_LIST?D.favs.map(f=>f.id).filter(x=>x!=null).map(String):[]);
const isFav=id=>favIds().includes(String(id));
function toggleFav(id){id=String(id);const a=favIds().slice(),i=a.indexOf(id);if(i>-1)a.splice(i,1);else a.push(id);FAV=a;store.set("fuel-favs-v1",a)}
function label(s){const f=D.favs.find(f=>f.id!=null&&String(f.id)===String(s.i));return f?f.label:s.n}
const saveS=()=>store.set("fuel-settings-v1",S);
const tankCost=(s,k=S.fuel)=>(S.tank&&s[k]!=null)?S.tank*s[k]/100:null;
function colour(s){const v=s[S.fuel],t=thr[S.fuel];if(v==null||!t)return["#94a3b8","#fff"];return v<=t[0]?["#16a34a","#fff"]:v<=t[1]?["#f59e0b","#1a1d23"]:["#dc2626","#fff"]}
const starText=id=>isFav(id)?"★ Remove from my stations":"☆ Add to my stations";
const starBtn=id=>`<button class="act star" data-id="${esc(id)}">${starText(id)}</button>`;

// ---- fuel card discount: reduces the prices of stations that accept your card ----
const brandOn=v=>v===true||v>0;
const cardAccepts=s=>{const c=S.card,bk=s.bk||(s.bk=brand(s)[0]),ov=c.ov[String(s.i)];return ov!==undefined?ov:brandOn(c.brands[bk])};
const cardDisc=(s,k)=>S.card.on&&cardAccepts(s)?(S.card.r[k]||0):0;
function applyCard(){
 for(const s of D.stations){
  if(!s.o)s.o={d:s.d,p:s.p,sd:s.sd,sp:s.sp};
  s.dc=null;
  for(const k of["d","p","sd","sp"]){
   const v=s.o[k];if(v==null){delete s[k];continue}
   const x=cardDisc(s,k);s[k]=x?+(v-x).toFixed(1):v;if(x)(s.dc=s.dc||{})[k]=x;
  }
 }
 for(const [k] of FUELS){const a=D.stations.map(s=>s[k]).filter(v=>v!=null).sort((x,y)=>x-y);if(a.length)thr[k]=[a[Math.floor(a.length*.33)],a[Math.floor(a.length*.66)]]}
}
function cardChanged(){saveS();applyCard();renderFavs();if(view==="near"&&loc)renderNearby();if(view==="best")bestRefresh();if(map)layers()}
// fuel card icons: a generic card in blue with a red stripe (not the official artwork)
const cardSvg=`<svg viewBox="0 0 46 31"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e5bd8"/><stop offset="1" stop-color="#0a2f73"/></linearGradient></defs><rect width="46" height="31" rx="5" fill="url(#cg)"/><rect y="20" width="46" height="4" fill="#e1251b"/><rect x="5" y="7" width="9" height="7" rx="1.5" fill="#f5c84c"/><path d="M5 10.5h9M9.5 7v7" stroke="#b8902a" stroke-width=".7"/><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"><path d="M31 16V7.5a1 1 0 0 1 1-1h4.5a1 1 0 0 1 1 1V16M30 16h8.5M37.5 9.5h1.3a1 1 0 0 1 1 1v3a.8.8 0 0 0 1.6 0V9l-1.6-1.6"/></g><rect x="5" y="26" width="14" height="1.6" rx=".8" fill="#fff" opacity=".45"/></svg>`;
const CI=`<span class="ci" title="Fuel card price">${cardSvg.replace('id="cg"','id="cg2"').replace("url(#cg)","url(#cg2)")}</span>`;
const cardTxt=s=>CI+" "+(cardAccepts(s)?"Accepts my fuel card":"Doesn’t accept my card")+" (tap to change)";
const cardBtn=s=>`<button class="act cardb" data-id="${esc(s.i)}">${cardTxt(s)}</button>`;
function handleCard(b,pop){
 const s=byId[b.dataset.id];if(!s)return;
 const c=S.card,id=String(s.i),want=!cardAccepts(s),bd=brandOn(c.brands[s.bk]);
 if(want===bd)delete c.ov[id];else c.ov[id]=want;
 saveS();applyCard();renderFavs();if(view==="near"&&loc)renderNearby();if(view==="best")bestRefresh();
 if(pop){pop.setContent(popup(s));bindPop(pop);cardDirty=true}else{detail(id);if(map)layers()}
}
const inpCss="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)";
const cardRatesHtml=()=>{const f=(k,t)=>`<label style="display:flex;justify-content:space-between;align-items:center;gap:6px">${t}<span><input id="cr_${k}" type="number" inputmode="decimal" step="0.5" min="0" max="30" value="${S.card.r[k]}" style="width:60px;${inpCss}"> p</span></label>`;return `<div style="margin:16px 0 4px;font-weight:600">WEX Esso fuel card discounts</div><p class="small" style="margin:0 0 8px">Pence off per litre at Esso stations. They apply when “I have a WEX Esso fuel card” is ticked on the My stations tab. Change them if your card terms change.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.85rem">${f("p","Synergy Unleaded")}${f("d","Synergy Diesel")}${f("sp","Supreme+ 99 Unleaded")}${f("sd","Supreme+ Diesel")}</div>`};
const showCardBtn=s=>S.card.on&&(brandOn(S.card.brands[s.bk||(s.bk=brand(s)[0])])||S.card.ov[String(s.i)]!==undefined);
fetch("data/stations.json?"+Date.now()).then(r=>r.json()).then(init).catch(()=>{$("stamp").textContent="Couldn’t load price data.";noData("Couldn’t load price data. Check your connection and reload.")});
function noData(msg){$("favrows").innerHTML=`<div class="empty">${esc(msg)}</div>`}
function init(d){
 D=d;d.stations.forEach(s=>byId[String(s.i)]=s);
 if(!d.stations.length){$("stamp").textContent="No data yet: run the “Refresh fuel prices” workflow in GitHub Actions.";noData("No price data yet.");return}
 applyCard();
 stamp();renderFavs();renderFillCard();
}
const stamp=()=>{$("stamp").textContent=`${FN[S.fuel]} first · data refreshed ${ago(D.updated)}`};

function row(s,sub,best){const v=s[S.fuel],fc=S.tank&&v!=null?litres()*v/100:null,pm=v!=null?ppm(v):"";
 const l3=[fc!=null?`${gbp(fc)} for ${litres().toFixed(0)} L`:"",pm].filter(Boolean).join(" · ");
 return `<button class="row" data-id="${esc(s.i)}">${logo(s)}<div class="info"><div class="name">${isFav(s.i)?'<span class="fav">★</span>':""}${esc(label(s))}${best?'<span class="badge">Cheapest</span>':""}</div><div class="where">${esc(sub)}</div>${l3?`<div class="l3">${esc(l3)}</div>`:""}</div><div class="price"><div class="big">${fpH(v)}</div><div class="lab"><span class="tier" style="--tier:${colour(s)[0]}"></span>${esc(FN[S.fuel])}${s.dc&&s.dc[S.fuel]?CI:""}</div></div></button>`}

function renderFavs(){
 const k=S.fuel,list=favIds().map(i=>byId[i]).filter(Boolean).sort((a,b)=>((a[k]==null)-(b[k]==null))||(a[k]-b[k])||0);
 const best=list.length&&list[0][k]!=null?list[0][k]:null;
 $("favrows").innerHTML=list.length?`<div class="h2"><span>My stations</span><span>${list.length}</span></div>`+list.map(s=>row(s,subline(s),s[k]!=null&&s[k]===best)).join(""):'<div class="empty">No stations yet. Open the <b>UK map</b> or <b>Nearby</b>, tap a station and press ☆ to add it.</div>';
}

function getLoc(force){
 const el=$("v-near");
 if(!navigator.geolocation){el.innerHTML='<div class="empty">Location isn’t available on this device.</div>';return}
 if(loc&&!force&&Date.now()-loc.t<120000){renderNearby();return}
 el.innerHTML='<div class="empty">Finding your location…</div>';
 navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lon:p.coords.longitude,t:Date.now()};nShow=40;renderNearby()},
  ()=>{el.innerHTML='<div class="empty">Couldn’t get your location. Allow location for this site, then<br><br><button class="act" id="retry">Try again</button></div>'},
  {enableHighAccuracy:false,timeout:15000,maximumAge:60000});
}
function renderNearby(){
 const k=S.fuel,r=S.radius*1.609344,arr=[];
 for(const s of D.stations){if(s[k]==null)continue;const d=km(loc.lat,loc.lon,s.la,s.lo);if(d<=r)arr.push([d,s])}
 arr.sort((a,b)=>(a[1][k]-b[1][k])||(a[0]-b[0]));
 let h=`<p class="small" style="margin:0 0 10px">${arr.length} stations with ${esc(FN[k])} within ${S.radius} miles, cheapest first</p>`;
 arr.slice(0,nShow).forEach(([d,s],i)=>{h+=row(s,subline(s,(d/1.609344).toFixed(1)+" mi"),i===0)});
 if(arr.length>nShow)h+='<button class="act" id="more">Show more</button>';
 if(!arr.length)h+='<div class="empty">Nothing found in this radius. Try a bigger radius in settings.</div>';
 $("v-near").innerHTML=h;
}

function tab(v){
 if(!D||!D.stations.length)return;
 view=v;for(const x of ["list","near","map","best"]){$("v-"+x).hidden=x!==v;$("t-"+x).setAttribute("aria-selected",x===v)}
 if(v==="near"){nShow=40;getLoc()}
 if(v==="best")bestOpen();
 if(v==="map"){buildMap();map.locate({watch:true,setView:false,maximumAge:30000});setTimeout(()=>map.invalidateSize(),50)}else if(map)map.stopLocate();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.v));

function sheet(html){$("sheet").innerHTML='<div class="card">'+html+'</div>';$("sheet").hidden=false}
const closeSheet=()=>{$("sheet").hidden=true};
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

function detail(id){
 const s=byId[id];if(!s)return;
 const order=[S.fuel,...FUELS.map(f=>f[0]).filter(k=>k!==S.fuel)];
 const tiles=order.filter(k=>k===S.fuel||s[k]!=null).map(k=>`<div class="fuel${k===S.fuel?" d":""}"><div class="lab">${FN[k]}</div><div class="big">${fpH(s[k])}</div>${s[k]!=null?`<div class="tank">${[S.tank?gbp(litres()*s[k]/100)+" for "+litres().toFixed(0)+" L":"",ppm(s[k])].filter(Boolean).join(" · ")}</div>`:""}${s.dc&&s.dc[k]?`<div class="tank">${CI} ${s.dc[k]}p off (pump ${(s[k]+s.dc[k]).toFixed(1)}p)</div>`:""}</div>`).join("");
 sheet(`<div class="dh">${logo(s)}<h2>${esc(label(s))}</h2></div><div class="where">${esc(s.n)} · ${esc(s.pc)} · updated ${esc(ago(s.u))}</div>
 ${S.tank?`<p class="small">Cost for ${descP(S.fillPct,"nothing","a full tank")} (${litres().toFixed(0)} L)${S.car?" in your "+esc(S.car):""}${S.mpg?`, adding about ${fillMiles().toFixed(0)} miles`:""}:</p>`:""}<div class="fuels">${tiles}</div>
 <div class="acts">${starBtn(s.i)}${showCardBtn(s)?cardBtn(s):""}<button class="act" id="show" data-id="${esc(s.i)}">Show on map</button><a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.la},${s.lo}">Directions</a>${viaLink(s)}<button class="act mute" id="hide">Close</button></div>`);
}

function settings(){
 sheet(`<h2>Settings</h2>
 <label class="fld">Show this fuel first<select id="sFuel">${FUELS.map(f=>`<option value="${f[0]}"${f[0]===S.fuel?" selected":""}>${f[1]}</option>`).join("")}</select></label>
 <label class="fld">Nearby radius<select id="sRad">${[5,10,15,25,50].map(r=>`<option value="${r}"${r===S.radius?" selected":""}>${r} miles</option>`).join("")}</select></label>
 <label class="fld">My car (optional)<input id="sCar" placeholder="e.g. Ford Focus 1.5 TDCi" value="${esc(S.car)}"></label>
 <label class="fld">Tank size (litres)<input id="sTank" type="number" inputmode="decimal" min="1" max="300" placeholder="e.g. 55" value="${S.tank||""}"></label>
 <label class="fld">Car economy (mpg, UK gallons)<input id="sMpg" type="number" inputmode="decimal" min="5" max="200" placeholder="e.g. 55" value="${S.mpg||""}"></label>

async function doSuggest(w,q){
 const my=++sugSeq[w];q=(q||"").trim();const items=[];
 if(w==="from")items.push({me:true,label:"📍 My location"});
 if(q.length>=2&&!/^my location$/i.test(q)){
  const pc=q.replace(/\s+/g,"").toUpperCase();
  if(/^[A-Z]{1,2}\d[A-Z\d]?\d?[A-Z]{0,2}$/.test(pc)){
   try{const j=await(await fetch(`https://api.postcodes.io/postcodes/${pc}/autocomplete?limit=5`)).json();
    if(j&&j.result)j.result.forEach(p=>items.push({pc:p,label:p,sub:"Postcode"}))}catch(e){}
  }
  if(!items.some(x=>!x.me)){
   try{const b=loc?`&lat=${loc.lat}&lon=${loc.lon}`:"&lat=51.45&lon=-1.0";
    const j=await(await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lang=en&bbox=-8.7,49.8,1.9,60.9${b}`)).json();
    for(const f of(j&&j.features)||[]){
     const p=f.properties||{},c=f.geometry&&f.geometry.coordinates;if(!c||(p.countrycode||"GB")!=="GB")continue;
     const street=p.street?((p.housenumber?p.housenumber+" ":"")+p.street):"",main=p.name||street||p.city||"";if(!main)continue;
     const sub=[...new Set([street,p.city||p.district||p.locality,p.county||p.state,p.postcode].filter(x=>x&&x!==main))].join(", ");

    }
   }catch(e){}
  }

 }
 if(my!==sugSeq[w])return;
 renderSugg(w,items);
}

// route maths
function segDist(la,lo,a,b){const kx=111.32*Math.cos(la*Math.PI/180),ky=111,
 ax=(a[1]-lo)*kx,ay=(a[0]-la)*ky,bx=(b[1]-lo)*kx,by=(b[0]-la)*ky,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
 let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));return[Math.hypot(ax+t*dx,ay+t*dy),t]}
function resample(c){const cum=[0];for(let i=1;i<c.length;i++)cum.push(cum[i-1]+km(c[i-1][1],c[i-1][0],c[i][1],c[i][0]));
 const total=cum[cum.length-1],step=Math.max(0.5,total/600),pts=[[c[0][1],c[0][0],0]];let next=step;
 for(let i=1;i<c.length-1;i++)if(cum[i]>=next){pts.push([c[i][1],c[i][0],cum[i]]);next=cum[i]+step}
 pts.push([c[c.length-1][1],c[c.length-1][0],total]);return pts}
async function maybePlan(){
 if(!tripUI.fp||!tripUI.tp)return;
 const my=++planSeq,out=$("best-out");
 setInfo("Planning route…");out.innerHTML="";
 try{
  const pt=async p=>p.me?(({lat,lon})=>({lat,lon,me:true}))(await whereAmI()):p;
  const a=await pt(tripUI.fp),b=await pt(tripUI.tp);if(my!==planSeq)return;
  let j;try{j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`)).json()}
  catch(e){throw new Error("Couldn’t get a route right now. The free routing service may be busy, so try again in a minute.")}
  if(my!==planSeq)return;
  if(!j.routes||!j.routes.length)throw new Error("No driving route found between those places.");
  const rt=j.routes[0];
  trip={from:a,to:b,line:rt.geometry.coordinates.map(c=>[c[1],c[0]]),pts:resample(rt.geometry.coordinates),miles:rt.distance/1609.344,mins:rt.duration/60,ids:new Set(),top:[]};
  setInfo(tripInfo());drawTripMap();
  if(!S.mpg){out.innerHTML=needMpg();return}
  tripShow();
 }catch(e){if(my!==planSeq)return;trip=null;setInfo(`<span style="color:#dc2626">${esc(e.message||"Couldn’t plan that route.")}</span>`);drawTripMap()}
}
function tripCalc(){
 const k=S.fuel,W=tripUI.corr*MI,R=trip.pts;let a=90,b=-90,c=180,d=-180;
 for(const p of R){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1]}
 const pl=W/111,po=W/(111*Math.cos((a+b)/2*Math.PI/180)),out=[];
 for(const s of D.stations){
  if(s[k]==null||s.la<a-pl||s.la>b+pl||s.lo<c-po||s.lo>d+po)continue;
  let best=1e9,al=0;
  for(let i=0;i<R.length-1;i++){const r=segDist(s.la,s.lo,R[i],R[i+1]);if(r[0]<best){best=r[0];al=R[i][2]+r[1]*(R[i+1][2]-R[i][2])}}
  if(best>W)continue;
  const off=best<0.15?0:best*ROAD/MI,drive=2*off*cpm(s[k]),fill=buyL()*s[k]/100;
  out.push({s,off,along:al/MI,drive,fill,total:fill+drive});
 }
 return out.sort((x,y)=>x.total-y.total);
}
function pointAt(d){const R=trip.pts;for(let i=0;i<R.length-1;i++)if(R[i+1][2]>=d){const t=(d-R[i][2])/((R[i+1][2]-R[i][2])||1);return[R[i][0]+t*(R[i+1][0]-R[i][0]),R[i][1]+t*(R[i+1][1]-R[i][1])]}return[R[R.length-1][0],R[R.length-1][1]]}
function tripShow(){
 const out=$("best-out"),all=tripCalc(),lim=S.useLevel?rangeNow()-RESERVE:null;
 const res=lim==null?all:all.filter(x=>x.along+x.off<=lim),hid=all.length-res.length;
 let note="";trip.fillPt=null;
 if(lim!=null){
  if(lim>=trip.miles)note=`With about ${rangeNow().toFixed(0)} miles of range you can reach the end without filling up. These are the cheapest places to top up on the way anyway. `;
  else{const at=Math.max(lim,0);trip.fillPt=pointAt(at*MI);
   note=`With about ${rangeNow().toFixed(0)} miles of range you’ll need to fill up before mile ${at.toFixed(0)} of ${trip.miles.toFixed(0)} (roughly ${fmtMins(trip.mins*at/trip.miles)} in, keeping a ${RESERVE}-mile reserve). Only stations you can reach are shown${hid?` (${hid} further along hidden)`:""}. `}
 }
 trip.ids=new Set(res.map(x=>String(x.s.i)));trip.top=res.slice(0,10);
 drawTripMap();
 if(!res.length){out.innerHTML=`<div class="empty">${esc(note)}No stations with ${esc(FN[S.fuel])} within ${tripUI.corr} mile${tripUI.corr>1?"s":""} of that route${lim!=null?" that you can reach":""}. ${lim!=null&&lim<trip.miles?"You may need to fill up before you set off, or try a larger distance off the route.":"Try a larger distance."}</div>`;return}
 const avg=res.reduce((a,x)=>a+x.total,0)/res.length;
 out.innerHTML=`<p class="small" style="margin:0 0 10px">${esc(note)}${res.length} stations within ${tripUI.corr} mile${tripUI.corr>1?"s":""} of the route, ranked by fill-up plus the detour. The best is about ${gbp(avg-res[0].total)} cheaper than the average. ${assume()}</p>`
  +res.slice(0,bestShow).map((x,i)=>bestRow(x,i,subline(x.s,Math.round(x.along)+" mi into trip"+(x.off>=0.1?" · "+x.off.toFixed(1)+" mi off route":" · on route")))).join("")
  +(res.length>bestShow?'<button class="act" id="bMore">Show more</button>':"");
}

// the preview map: start/end pins as soon as they're chosen, then the route and the best stations
function initMap2(){
 killMap2();if(!$("map2"))return;
 map2=L.map("map2");
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map2);
 map2Layer=L.layerGroup().addTo(map2);
 map2.setView(loc?[loc.lat,loc.lon]:[52.5,-1.8],loc?11:6);
 drawTripMap();setTimeout(()=>{if(map2)map2.invalidateSize()},60);
}
function drawTripMap(){
 if(!map2||!map2Layer)return;
 map2Layer.clearLayers();
 const ab=(p,t,c)=>L.marker(p,{icon:L.divIcon({className:"",html:`<div class="ab ${c}">${t}</div>`,iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:3000}).addTo(map2Layer);
 const pts=[],at=p=>p&&(p.me?(loc?[loc.lat,loc.lon]:null):[p.lat,p.lon]);
 const A=at(tripUI.fp),B=at(tripUI.tp);
 if(A){ab(A,"A","a");pts.push(A)}
 if(B){ab(B,"B","b");pts.push(B)}
 if(trip){
  if(trip.fillPt)ab(trip.fillPt,"⛽","w").bindTooltip("Fill up before here");
  const line=L.polyline(trip.line,{color:"#d4008c",weight:5,opacity:.85}).addTo(map2Layer);
  (trip.top||[]).forEach((x,i)=>{const[bg,fg]=colour(x.s);
   const ic=L.divIcon({className:"",html:`<div class="fp${i===0?" gold":""}" style="background:${bg};color:${fg}">${i+1} · ${x.s[S.fuel].toFixed(1)}</div>`,iconSize:[78,26],iconAnchor:[39,13]});
   L.marker([x.s.la,x.s.lo],{icon:ic,zIndexOffset:i===0?2000:1000-i}).on("click",()=>detail(String(x.s.i))).addTo(map2Layer)});
  map2.fitBounds(line.getBounds(),{padding:[24,24]});
 }else if(pts.length===2)map2.fitBounds(L.latLngBounds(pts),{padding:[40,40]});
 else if(pts.length===1)map2.setView(pts[0],12);
}
function viaLink(s){
 if(!trip||!trip.ids.has(String(s.i)))return"";
 return `<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1${trip.from.me?"":`&origin=${trip.from.lat},${trip.from.lon}`}&destination=${trip.to.lat},${trip.to.lon}&waypoints=${s.la},${s.lo}&travelmode=driving">Route via here</a>`}

document.addEventListener("click",e=>{
 const t=e.target;
 const sg=t.closest(".sg");if(sg){pickSugg(sg.dataset.w,+sg.dataset.i);return}
 if(!t.closest(".tfield"))hideSugg();
 const m=t.closest("#best-seg button");
 if(m){bestMode=m.dataset.m;bestShow=20;bestControls();bestRefresh();return}
 if(t.id==="openSet"){settings();return}
 if(t.id==="aRetry"){renderAround();return}
 if(t.id==="bMore"){bestShow+=20;bestRefresh();return}
 if(t.id==="tSwap"){swapPts();return}
});
document.addEventListener("change",e=>{
 const id=e.target.id;
 if(id==="cardOn"){S.card.on=e.target.checked;S.card.brands={esso:true};cardChanged()}
 if(id==="aRound"){aroundUI.round=e.target.checked;renderAround()}
 if(id==="tCorr"){tripUI.corr=+e.target.value;if(trip)tripShow()}
 const cl=e.target.classList;
 if(id==="useLvl"){S.useLevel=e.target.checked;saveS();$("lvlBox").innerHTML=lvlInner();$("fillWrap").innerHTML=S.useLevel?"":fillHtml();bestRefresh()}
 if(cl&&(cl.contains("fillR")||cl.contains("lvlR"))&&view==="best")bestRefresh();
});
document.addEventListener("input",e=>{
 const id=e.target.id;
 if(id&&id.startsWith("cr_")){const k=id.slice(3),v=parseFloat(e.target.value);S.card.r[k]=v>=0?v:0;cardChanged()}
 if(id==="tFrom"||id==="tTo"){
  const w=id==="tFrom"?"from":"to";
  tripUI[w]=e.target.value;tripUI[w==="from"?"fp":"tp"]=null;trip=null;planSeq++;
  $("best-out").innerHTML="";setInfo("");drawTripMap();
  clearTimeout(sugTimer[w]);sugTimer[w]=setTimeout(()=>doSuggest(w,e.target.value),300);
 }
 const cl=e.target.classList;
 if(cl&&cl.contains("fillR")){const v=snap(+e.target.value);e.target.value=v;if(v===S.fillPct)return;S.fillPct=v;saveS();syncFill();renderFavs()}
 if(cl&&cl.contains("lvlR")){const v=snap(+e.target.value);e.target.value=v;e.target.style.setProperty("--p",v+"%");S.level=v;saveS();syncLvl()}
});
document.addEventListener("focusin",e=>{
 const id=e.target.id;
 if(id==="tFrom"||id==="tTo"){if(e.target.select)e.target.select();const w=id==="tFrom"?"from":"to";if(w==="from"&&!tripUI.fp)doSuggest("from","");else if(!(tripUI[w==="from"?"fp":"tp"]))doSuggest(w,e.target.value)}
});
document.addEventListener("keydown",e=>{
 const id=e.target.id;
 if((id==="tFrom"||id==="tTo")&&e.key==="Enter"){
  e.preventDefault();const w=id==="tFrom"?"from":"to",list=suggItems[w]||[],i=list.findIndex(x=>!x.me&&!x.none);
  const pick=i>-1?i:list.findIndex(x=>x.me);if(pick>-1)pickSugg(w,pick);if(e.target.blur)e.target.blur();
 }
});

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
